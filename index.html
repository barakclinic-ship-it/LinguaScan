<style>
:root{
  --gold:#D9A441; --gold-light:#FBF1DC; --gold-dark:#B7842A;
  --ink:#2E2A24; --ink-soft:#8A8070;
  --line:#E9E0CC;
  --bg:#FBF8F1; --paper:#FFFFFF;
  --green:#4C8C5C; --red:#B5453E; --amber:#D9A441;
  --radius:10px;
  --shadow:0 2px 10px rgba(50,40,20,0.06);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; overflow:hidden; overscroll-behavior:none;}
body{
  margin:0;
  font-family:'Assistant',sans-serif; color:var(--ink);
  background:var(--bg);
  font-size:15px; line-height:1.55; font-weight:400;
}
.ltr{direction:ltr; unicode-bidi:isolate;}
#app{max-width:480px; margin:0 auto; padding:0 18px; height:100svh; height:100dvh; display:flex; flex-direction:column; overflow:hidden;}
.topbar{display:flex; align-items:center; justify-content:space-between; padding:16px 0 14px; flex-shrink:0; border-bottom:1px solid var(--line);}
.screen-body{flex:1; min-height:0; overflow-y:auto; padding:14px 0 16px; -webkit-overflow-scrolling:touch;}
.list-scroll{max-height:28vh; overflow-y:auto; -webkit-overflow-scrolling:touch;}
.logo{display:flex; align-items:center; gap:10px;}
.logo-dot{width:34px; height:34px; border-radius:8px; background:#FFFFFF; border:1px solid var(--line); color:var(--gold-dark); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; padding:3px; overflow:hidden;}
.logo-text{font-family:'Frank Ruhl Libre',serif; font-weight:600; font-size:18px; letter-spacing:0.1px; color:var(--ink);}
.logo-sub{font-size:10.5px; color:var(--ink-soft); margin-top:0;}
.icon-btn{width:32px; height:32px; border-radius:8px; border:1px solid var(--line); background:var(--paper); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:14px; color:var(--ink-soft);}

.card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; margin-bottom:12px;}
h1{font-family:'Frank Ruhl Libre',serif; font-size:22px; font-weight:600; margin:0 0 6px; letter-spacing:0.1px; color:var(--ink);}
h2{font-family:'Frank Ruhl Libre',serif; font-size:17px; font-weight:600; margin:0 0 10px; color:var(--ink);}
p.sub{color:var(--ink-soft); font-size:13px; line-height:1.6; margin:0 0 12px;}

.steps{display:flex; flex-direction:column; gap:9px; margin-bottom:16px;}
.step{display:flex; align-items:flex-start; gap:10px;}
.step-num{width:20px; height:20px; min-width:20px; border-radius:50%; color:#fff; font-size:11px; font-weight:600; display:flex; align-items:center; justify-content:center; margin-top:1px; background:var(--gold);}
.step-txt{font-size:13px; line-height:1.5; color:var(--ink-soft);}
.step-txt b{font-weight:600; color:var(--ink);}

.dropzone{
  border:1px dashed #DCCB9E; border-radius:var(--radius);
  background:var(--gold-light); padding:22px 14px; text-align:center;
  cursor:pointer; transition:.2s; margin-bottom:10px;
}
.dropzone.drag{background:#F5EBD0; border-color:var(--gold-dark);}
.dropzone .icn{font-size:21px; margin-bottom:6px; opacity:.75; color:var(--gold-dark);}
.dropzone .txt{font-weight:600; font-size:13.5px; color:var(--ink);}
.dropzone .txt2{font-size:11px; color:var(--ink-soft); margin-top:3px;}
.filetypes{display:flex; gap:6px; justify-content:center; margin-top:10px; flex-wrap:wrap;}
.filetype-chip{background:var(--paper); border:1px solid var(--line); border-radius:6px; padding:4px 11px; font-size:11px; color:var(--ink-soft);}

.btn{
  border:none; border-radius:8px; padding:13px 16px; font-family:inherit;
  font-weight:600; font-size:14px; cursor:pointer; width:100%;
  display:flex; align-items:center; justify-content:center; gap:8px;
  transition:.15s;
}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--gold-dark); color:#fff;}
.btn-pink{background:var(--ink); color:#fff;}
.btn-blue{background:#4A6A8A; color:#fff;}
.btn-brown{background:var(--paper); color:var(--gold-dark); border:1px solid var(--gold);}
.btn-ghost{background:var(--paper); color:var(--ink); border:1px solid var(--line);}
.btn-sm{padding:8px 14px; font-size:12.5px; width:auto;}
.btn[disabled]{opacity:.4; cursor:not-allowed;}

.game-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.game-tile{
  border-radius:var(--radius); padding:16px 14px; cursor:pointer; border:1px solid var(--line);
  background:var(--paper); position:relative; overflow:hidden; min-height:88px;
  display:flex; flex-direction:column; justify-content:flex-end;
}
.game-tile .icon{position:absolute; top:12px; left:12px; font-size:17px; opacity:.6; color:var(--gold-dark);}
.game-tile .title{font-weight:600; font-size:13.5px; color:var(--ink);}
.game-tile .desc{font-size:10.5px; opacity:.85; margin-top:1px; color:var(--ink-soft);}
.tile-1, .tile-2, .tile-3, .tile-4{border-top:2px solid var(--gold);}

.deck-item{
  display:flex; align-items:center; justify-content:space-between;
  background:var(--paper); border:1px solid var(--line); border-radius:9px; padding:11px 13px; margin-bottom:8px;
  cursor:pointer;
}
.deck-item .meta{font-size:11px; color:var(--ink-soft); margin-top:1px;}
.deck-badge{background:var(--gold-light); color:var(--gold-dark); font-size:10.5px; padding:3px 9px; border-radius:6px; font-weight:600;}

.spinner{width:32px; height:32px; border-radius:50%; border:3px solid var(--gold-light); border-top-color:var(--gold-dark); animation:spin 0.9s linear infinite; margin:16px auto;}
@keyframes spin{to{transform:rotate(360deg);}}
.center-txt{text-align:center; color:var(--ink-soft); font-size:13px;}

.word-row{display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line);}
.word-row:last-child{border-bottom:none;}
.word-main{font-weight:600; font-size:14.5px; color:var(--ink);}
.word-trans{color:var(--ink-soft); font-size:12.5px; margin-top:1px;}
.chip-len{background:var(--gold-light); color:var(--gold-dark); font-size:10.5px; padding:3px 8px; border-radius:6px; font-weight:600;}

/* Flashcard */
.flip-wrap{perspective:1200px; margin-bottom:14px;}
.flip-card{position:relative; width:100%; height:min(200px,32vh); transition:transform .5s; transform-style:preserve-3d; cursor:pointer;}
.flip-card.flipped{transform:rotateY(180deg);}
.flip-face{
  position:absolute; inset:0; backface-visibility:hidden; border-radius:var(--radius);
  display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px;
  box-shadow:var(--shadow); text-align:center; border:1px solid var(--line);
}
.flip-front{background:var(--gold-light); color:var(--gold-dark);}
.flip-back{background:var(--ink); color:#fff;}
.flip-word{font-family:'Frank Ruhl Libre',serif; font-size:27px; font-weight:600;}
.flip-pos{font-size:11.5px; opacity:.75; margin-top:5px;}
.flip-example{font-size:12.5px; opacity:.85; margin-top:10px; line-height:1.4;}
.nav-row{display:flex; gap:8px; margin-top:8px;}
.progress-txt{text-align:center; color:var(--ink-soft); font-size:12.5px; margin-bottom:10px;}

/* Quiz */
.quiz-word{font-family:'Frank Ruhl Libre',serif; font-size:26px; font-weight:600; text-align:center; margin:8px 0 18px; color:var(--ink);}
.opt-btn{
  display:block; width:100%; text-align:right; background:var(--paper); border:1.5px solid var(--line);
  border-radius:8px; padding:14px 16px; margin-bottom:9px; font-family:inherit; font-size:16px;
  cursor:pointer; font-weight:600; color:var(--ink);
}
.opt-btn.correct{border-color:var(--green); background:#EDF5EE; color:#3B6E48;}
.opt-btn.wrong{border-color:var(--red); background:#F8ECEB; color:#953B35;}
.score-pill{background:var(--gold-light); color:var(--gold-dark); border-radius:6px; padding:4px 12px; font-size:12.5px; font-weight:700;}

/* Memory */
.mem-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:7px;}
.mem-card{
  aspect-ratio:0.95; border-radius:8px; background:var(--gold-light); border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  font-size:18px; color:var(--gold-dark); text-align:center; padding:6px; font-weight:600;

<body>
<div id="app"></div>

<script>
// ---------------- Global State ----------------
let state = {
  screen: 'home',
  deck: null,
  savedDecks: [],
  uploadedFile: null,
  gameData: {},
  soundEnabled: true
};
try{ const savedSound = localStorage.getItem('linguaScanSound'); if(savedSound==='0') state.soundEnabled=false; }catch(e){}

const app = document.getElementById('app');

// ---------------- Storage ----------------
const hasClaudeStorage = typeof window.storage !== 'undefined';

async function loadSavedDecks(){
  try{
    if(hasClaudeStorage){
      const list = await window.storage.list('deck:');
      if(!list || !list.keys) return [];
      const decks = [];
      for(const k of list.keys){
        try{
          const r = await window.storage.get(k);
          if(r) decks.push(JSON.parse(r.value));
        }catch(e){}
      }
      decks.sort((a,b)=> b.createdAt - a.createdAt);
      return decks;
    } else {
      const raw = localStorage.getItem('linguaScanDecks');
      const decks = raw ? JSON.parse(raw) : [];
      decks.sort((a,b)=> b.createdAt - a.createdAt);
      return decks;
    }
  }catch(e){ return []; }
}
async function saveDeck(deck){
  try{
    if(hasClaudeStorage){
      await window.storage.set('deck:'+deck.id, JSON.stringify(deck));
    } else {
      const raw = localStorage.getItem('linguaScanDecks');
      const decks = raw ? JSON.parse(raw) : [];
      decks.push(deck);
      localStorage.setItem('linguaScanDecks', JSON.stringify(decks));
    }
  }catch(e){}
}
async function deleteDeck(id){
  try{
    if(hasClaudeStorage){
      await window.storage.delete('deck:'+id);
    } else {
      const raw = localStorage.getItem('linguaScanDecks');
      let decks = raw ? JSON.parse(raw) : [];
      decks = decks.filter(d=>d.id!==id);
      localStorage.setItem('linguaScanDecks', JSON.stringify(decks));
    }
  }catch(e){}
}

// ---------------- Language options & stopwords ----------------
const LANG_OPTIONS = [
  {code:'auto', mm:null, label:'זיהוי אוטומטי'},
  {code:'por', mm:'pt', label:'פורטוגזית'},
  {code:'eng', mm:'en', label:'אנגלית'},
  {code:'spa', mm:'es', label:'ספרדית'},
  {code:'fra', mm:'fr', label:'צרפתית'},
  {code:'deu', mm:'de', label:'גרמנית'},
  {code:'ita', mm:'it', label:'איטלקית'}
];
state.selectedLang = 'auto';
const AUTO_OCR_CODE = 'por+eng+spa+fra+deu+ita';

const STOPWORDS = {
  pt: ['a','o','os','as','um','uma','uns','umas','de','do','da','dos','das','em','no','na','nos','nas','para','por','com','sem','que','se','e','ou','mas','como','mais','muito','ja','sao','foi','ser','estar','tem','ter','seu','sua','seus','suas','este','esta','isso','isto','aquele','aquela','eu','tu','ele','ela','nos','voces','eles','elas','me','te','lhe','nao','sim','ao','aos','pelo','pela','pelos','pelas','entre','sobre','ate','desde','quando','onde','porque','tambem','so','ainda','depois','antes'],
  en: ['the','a','an','of','to','in','on','at','for','with','without','and','or','but','as','is','are','was','were','be','been','being','have','has','had','this','that','these','those','i','you','he','she','it','we','they','me','him','her','us','them','my','your','his','its','our','their','not','no','yes','so','if','then','than','because','also','still','after','before','from','by','about','into','over','under'],
  es: ['el','la','los','las','un','una','unos','unas','de','del','en','y','o','pero','que','se','es','son','fue','ser','estar','tiene','tener','su','sus','este','esta','eso','esto','yo','tu','el','ella','nosotros','ellos','ellas','me','te','le','no','si','al','por','para','con','sin','entre','sobre','hasta','desde','cuando','donde','porque','tambien','solo','aun','despues','antes'],
  fr: ['le','la','les','un','une','des','de','du','en','et','ou','mais','que','qui','se','est','sont','etre','avoir','ce','cette','ces','je','tu','il','elle','nous','vous','ils','elles','me','te','lui','ne','pas','oui','non','au','aux','par','pour','avec','sans','entre','sur','jusque','depuis','quand','ou','parce','aussi','encore','apres','avant'],
  de: ['der','die','das','ein','eine','einen','einem','einer','und','oder','aber','dass','sich','ist','sind','war','waren','sein','haben','hat','hatte','dieser','diese','dieses','ich','du','er','sie','es','wir','ihr','mich','dich','ihn','nicht','ja','nein','am','im','zum','zur','fur','mit','ohne','zwischen','uber','bis','seit','wann','wo','weil','auch','noch','nach','vor'],
  it: ['il','lo','la','i','gli','le','un','uno','una','di','del','della','in','e','o','ma','che','si','e','sono','stato','essere','avere','ha','questo','questa','io','tu','lui','lei','noi','voi','loro','mi','ti','lo','non','si','no','al','per','con','senza','tra','fra','sopra','fino','da','quando','dove','perche','anche','ancora','dopo','prima']
};

// Definite/indefinite articles have no standalone Hebrew word (Hebrew uses a prefix for "the"
// and nothing at all for "a/an"), so a single-word translation for these is always meaningless.
// Everything else in STOPWORDS (conjunctions, pronouns, prepositions) DOES translate fine and stays included.
const ARTICLES = {
  pt: ['a','o','os','as','um','uma','uns','umas'],
  en: ['the','a','an'],
  es: ['el','la','los','las','un','una','unos','unas'],
  fr: ['le','la','les','un','une','des'],
  de: ['der','die','das','ein','eine','einen','einem','einer'],
  it: ['il','lo','la','i','gli','le','un','uno','una']
};

function detectLanguage(text){
  const tokens = (text.toLowerCase().match(/[\p{L}']+/gu)) || [];
  const scores = {};
  Object.keys(STOPWORDS).forEach(mm=>{ scores[mm]=0; });
  tokens.forEach(t=>{
    Object.keys(STOPWORDS).forEach(mm=>{
      if(STOPWORDS[mm].includes(t)) scores[mm]++;
    });
  });
  let bestMm = 'eng', bestScore = -1;
  Object.keys(scores).forEach(mm=>{
    if(scores[mm] > bestScore){ bestScore = scores[mm]; bestMm = mm; }
  });
  const found = LANG_OPTIONS.find(l=>l.mm===bestMm);
  return found || LANG_OPTIONS.find(l=>l.code==='eng');
}

function escapeRegex(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '$&'); }
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

function extractVocabFromText(text, langOpt){
  const sentences = text.split(/(?<=[.!?])\s+/).filter(s=>s.trim().length>2);
  const tokens = (text.toLowerCase().match(/[\p{L}'-]+/gu)) || [];
  const articles = ARTICLES[langOpt.mm] || [];
  const freq = {};
  tokens.forEach(w=>{
    if(w.length<2 || w.length>18) return;
    if(articles.includes(w)) return;
    if(/^\d+$/.test(w)) return;
    if(/(.)\1{3,}/.test(w)) return; // ocr noise like "aaaa"
    if(!/[aeiouàáâãäèéêëìíîïòóôõöùúûü]/i.test(w)) return; // no vowel at all = likely garbage
    freq[w] = (freq[w]||0)+1;
  });
  // Every unique recognizable word, most frequent first, no artificial cap
  let candidates = Object.keys(freq).sort((a,b)=> freq[b]-freq[a]).slice(0,300);
  return candidates.map(w=>{
    const example = sentences.find(s=> s.toLowerCase().includes(w)) || '';
    const m = text.match(new RegExp('\\b'+escapeRegex(w)+'\\b','i'));
    const original = m ? m[0] : w;
    return { word: original, translation:'', pos:'', example: example.trim().slice(0,140), length: original.length };
  });
}

function hasHebrew(s){ return /[\u0590-\u05FF]/.test(s); }

function isCleanTranslation(t){
  if(!t) return false;
  if(!hasHebrew(t)) return false;
  if(/[&<>{}\[\]|\\^~`*_#@]/.test(t)) return false; // artifact/markup symbols
  if(/[:;]/.test(t)) return false; // glossary-style fragments often carry stray colons
  const words = t.trim().split(/\s+/).filter(Boolean);
  if(words.length > 4) return false; // too long to be a real single-word/phrase translation
  if(words.length === 0) return false;
  return true;
}

function cleanTranslationText(t){
  return t.replace(/^[\s.,'"״׳-]+|[\s.,'"״׳-]+$/g, '').trim();
}

async function mmTranslate(text, srcCode, tgtCode){
  const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${srcCode}|${tgtCode}`);
  const data = await res.json();
  const t = data && data.responseData && data.responseData.translatedText;
  return (t || '').trim();
}

// Multi-meaning short words (like Portuguese "este" = east/this) get mistranslated when
// looked up alone, since MyMemory has no sentence context. This uses the word's own example
// sentence: translate the whole sentence, then pick the Hebrew word at the matching relative
// position as a context-informed candidate. It's a heuristic (word order isn't identical
// across languages), so it's only used when it looks like a plausible, clean single word.
async function contextTranslate(w, srcCode, tgtCode){
  if(!w.example) return null;
  const origTokens = w.example.split(/\s+/).map(t=>t.replace(/^[^\p{L}]+|[^\p{L}]+$/gu,'')).filter(Boolean);
  const idx = origTokens.findIndex(t=> t.toLowerCase()===w.word.toLowerCase());
  if(idx===-1 || origTokens.length<2) return null;
  let sentenceHe;
  try{ sentenceHe = await mmTranslate(w.example, srcCode, tgtCode); }catch(e){ return null; }
  if(!sentenceHe || !hasHebrew(sentenceHe)) return null;
  const heTokens = sentenceHe.split(/\s+/).map(t=>t.replace(/^[^\u0590-\u05FF]+|[^\u0590-\u05FF]+$/g,'')).filter(Boolean);
  if(!heTokens.length) return null;
  const ratio = origTokens.length>1 ? idx/(origTokens.length-1) : 0;
  const targetIdx = Math.max(0, Math.min(heTokens.length-1, Math.round(ratio*(heTokens.length-1))));
  const candidate = heTokens[targetIdx];
  if(candidate && candidate.length>=1 && hasHebrew(candidate)) return candidate;
  return null;
}

async function translateWords(words, srcCode, tgtCode, onProgress){
  const out = [];
  for(let i=0;i<words.length;i++){
    const w = words[i];
    if(onProgress) onProgress(`מתרגם מילים... (${i+1}/${words.length})`);
    try{
      let t = await mmTranslate(w.word, srcCode, tgtCode);
      t = t ? cleanTranslationText(t) : t;
      // MyMemory sometimes has no direct pair data and echoes back garbage or a non-Hebrew guess.
      // Fall back to a two-step translation through English, which has far richer coverage.
      if((!isCleanTranslation(t) || t.toLowerCase()===w.word.toLowerCase()) && srcCode!=='en'){
        await sleep(150);
        const viaEn = await mmTranslate(w.word, srcCode, 'en');
        if(viaEn && viaEn.toLowerCase()!==w.word.toLowerCase()){
          await sleep(150);
          let heFromEn = await mmTranslate(viaEn, 'en', tgtCode);
          heFromEn = heFromEn ? cleanTranslationText(heFromEn) : heFromEn;
          if(isCleanTranslation(heFromEn)) t = heFromEn;
        }
      }
      // Context check: short, common words are the ones most likely to have multiple meanings
      // (like "este" = east/this). Use the example sentence to try to catch mismatches.
      if(isCleanTranslation(t) && w.word.length<=6 && w.example){
        await sleep(150);
        const contextCandidate = await contextTranslate(w, srcCode, tgtCode);
        if(contextCandidate && isCleanTranslation(contextCandidate) && contextCandidate!==t){
          t = contextCandidate;
        }
      }
      if(isCleanTranslation(t) && t.toLowerCase()!==w.word.toLowerCase()){
        w.translation = t;
        out.push(w);
      }
    }catch(e){ /* skip word on failure */ }
    await sleep(150);
  }
  return out;
}

// ---------------- OCR / text extraction (free, local) ----------------
function preprocessImageForOcr(file){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      const maxDim = 2000;
      let {width,height} = img;
      if(width>maxDim || height>maxDim){
        if(width>height){ height=Math.round(height*maxDim/width); width=maxDim; }
        else{ width=Math.round(width*maxDim/height); height=maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width=width; canvas.height=height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,width,height);
      const imgData = ctx.getImageData(0,0,width,height);
      const d = imgData.data;
      for(let i=0;i<d.length;i+=4){
        const gray = 0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
        const contrast = Math.min(255, Math.max(0, (gray-128)*1.35+128));
        d[i]=d[i+1]=d[i+2]=contrast;
      }
      ctx.putImageData(imgData,0,0);
      URL.revokeObjectURL(url);
      resolve(canvas);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('לא ניתן לקרוא את התמונה')); };
    img.src = url;
  });
}

async function extractTextFromImage(file, langCode, onProgress){
  if(onProgress) onProgress('מכין את התמונה...');
  const canvas = await preprocessImageForOcr(file);
  if(onProgress) onProgress('מזהה טקסט בתמונה...');
  const { data } = await Tesseract.recognize(canvas, langCode, {
    logger: m=>{ if(onProgress && m.status==='recognizing text') onProgress('מזהה טקסט... ' + Math.round((m.progress||0)*100) + '%'); }
  });
  return data.text || '';
}

async function extractTextFromPdf(file, langCode, onProgress){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  let fullText = '';
  const textPages = Math.min(pdf.numPages, 8);
  for(let i=1;i<=textPages;i++){
    if(onProgress) onProgress(`קורא עמוד ${i} מתוך ${textPages}...`);
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    fullText += content.items.map(it=>it.str).join(' ') + '\n';
  }
  if(fullText.trim().length < 40){
    fullText = '';
    const ocrPages = Math.min(pdf.numPages, 3);
    for(let i=1;i<=ocrPages;i++){
      if(onProgress) onProgress(`מזהה טקסט בעמוד ${i} (סריקה)...`);
      const page = await pdf.getPage(i);
      const viewport = page.getViewport({scale:2});
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width; canvas.height = viewport.height;
      const ctx = canvas.getContext('2d');
      await page.render({canvasContext: ctx, viewport}).promise;
      const { data } = await Tesseract.recognize(canvas, langCode);
      fullText += (data.text||'') + '\n';
    }
  }
  return fullText;
}

async function extractDeckFromRawText(rawText, onProgress){
  if(!rawText || rawText.trim().length < 20){
    throw new Error('אין מספיק טקסט לעיבוד. נסה קטע ארוך יותר.');
  }
  const manualLang = LANG_OPTIONS.find(l=>l.code===state.selectedLang && l.code!=='auto');
  const isAuto = !manualLang;
  let langOpt = manualLang;
  if(isAuto){
    if(onProgress) onProgress('מזהה שפה...');
    langOpt = detectLanguage(rawText);
  }
  if(onProgress) onProgress('בוחר את המילים החשובות...');
  let words = extractVocabFromText(rawText, langOpt);
  if(words.length < 4){
    throw new Error('נמצאו מעט מדי מילים מתאימות בטקסט. נסה קטע עם יותר תוכן.');
  }
  words = await translateWords(words, langOpt.mm, 'he', onProgress);
  if(words.length < 4){
    throw new Error('לא הצלחנו לתרגם מספיק מילים כרגע. נסה שוב בעוד רגע.');
  }
  return { detectedLanguage: langOpt.label, words, sourceText: rawText.slice(0,6000), langCode: langOpt.mm };
}

async function processFile(file, onProgress){
  const manualLang = LANG_OPTIONS.find(l=>l.code===state.selectedLang && l.code!=='auto');
  const isAuto = !manualLang;
  const ocrCode = isAuto ? AUTO_OCR_CODE : manualLang.code;
  const ext = file.name.split('.').pop().toLowerCase();
  if(file.size > 25*1024*1024){
    throw new Error('הקובץ גדול מדי (מעל 25MB). נסה קובץ קטן יותר.');
  }
  let rawText = '';
  if(['png','jpg','jpeg','webp','gif'].includes(ext)){
    rawText = await extractTextFromImage(file, ocrCode, onProgress);
  } else if(ext==='pdf'){
    rawText = await extractTextFromPdf(file, ocrCode, onProgress);
  } else if(ext==='docx'){
    if(onProgress) onProgress('קורא את קובץ ה-Word...');
    const buf = await file.arrayBuffer();
    const result = await mammoth.extractRawText({arrayBuffer: buf});
    rawText = result.value;
  } else if(['xlsx','xls','csv'].includes(ext)){
    if(onProgress) onProgress('קורא את קובץ האקסל...');
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    rawText = wb.SheetNames.map(n=>XLSX.utils.sheet_to_csv(wb.Sheets[n])).join('\n');
  } else {
    throw new Error('סוג קובץ לא נתמך');
  }
  if(!rawText || rawText.trim().length < 20){
    throw new Error('לא הצלחנו לזהות מספיק טקסט בקובץ. נסה תמונה ברורה וחדה יותר, או ודא שבחרת את השפה הנכונה.');
  }
  return await extractDeckFromRawText(rawText, onProgress);
}

// ---------------- Rendering Router ----------------
function render(){
  if(state.screen==='home') return renderHome();
  if(state.screen==='processing') return renderProcessing();
  if(state.screen==='error') return renderError();
  if(state.screen==='deckReview') return renderDeckReview();
  if(state.screen==='fullTranslation') return renderFullTranslation();
  if(state.screen==='games') return renderGamesHub();
  if(state.screen==='flashcards') return renderFlashcards();
  if(state.screen==='quiz') return renderQuiz();
  if(state.screen==='memory') return renderMemory();
}

function topbar(showBack, backFn){

    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
    </svg>` : `
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <line x1="23" y1="9" x2="17" y2="15"></line>
      <line x1="17" y1="9" x2="23" y2="15"></line>
    </svg>`;
  return `<div class="topbar">
    <div style="display:flex; gap:8px;">
      <button class="icon-btn" onclick="toggleSound()" aria-label="הפעל/כבה קול">${soundIcon}</button>
      ${showBack ? `<button class="icon-btn" onclick="${backFn}">✕</button>` : ''}
    </div>

        ${LANG_OPTIONS.map(l=>`<option value="${l.code}" ${l.code===state.selectedLang?'selected':''}>${l.label}</option>`).join('')}
      </select>
      <div class="dropzone" id="dz">

        <div class="txt">גרור קובץ לכאן או לחץ לבחירה</div>

      <div class="divider-txt">או</div>
      <button class="btn btn-ghost" id="togglePasteBtn">הדבק טקסט מאתר אחר</button>
      <div id="pasteSection" style="display:none; margin-top:10px;">
        <textarea id="pasteArea" class="paste-area" placeholder="הדבק כאן פסקה או קטע טקסט שהעתקת מאתר אינטרנט..."></textarea>

      </div>
    </div>
    <div id="savedSection"></div>
  </div>`;
  document.getElementById('langSelect').onchange = (e)=>{ state.selectedLang = e.target.value; };
  document.getElementById('dz').onclick = ()=> document.getElementById('fileInput').click();
  document.getElementById('fileInput').onchange = (e)=>{
    if(e.target.files[0]) startProcessing(e.target.files[0]);
  };
  document.getElementById('cameraBtn').onclick = ()=> document.getElementById('cameraInput').click();
  document.getElementById('cameraInput').onchange = (e)=>{
    if(e.target.files[0]) startProcessing(e.target.files[0]);
  };
  document.getElementById('togglePasteBtn').onclick = ()=>{
    const sec = document.getElementById('pasteSection');
    sec.style.display = sec.style.display==='none' ? 'block' : 'none';
    if(sec.style.display==='block') document.getElementById('pasteArea').focus();
  };
  document.getElementById('processPasteBtn').onclick = ()=>{
    const text = document.getElementById('pasteArea').value.trim();
    if(text.length < 20){
      state.errorMsg = 'הדבק קטע טקסט ארוך יותר (לפחות כמה משפטים).';
      state.screen = 'error'; render(); return;
    }
    startProcessingFromText(text);
  };

  if(!state.selectedDeckIds) state.selectedDeckIds = new Set();
  renderSavedSection();

function renderSavedSection(){

  if(!sec) return;
  if(state.savedDecks.length){
    const selCount = state.selectedDeckIds.size;
    sec.innerHTML = `<div class="card">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
        <h2 style="margin:0;">חפיסות שמורות</h2>
        ${selCount>0 ? `<button class="btn btn-pink btn-sm" onclick="playSelectedDecks()">שחק בבחירה (${selCount})</button>` : ''}
      </div>
      <div class="list-scroll">
      ${state.savedDecks.map(d=>`
        <div class="deck-item" onclick="openDeck('${d.id}')">
          <div style="display:flex; align-items:center; gap:10px;">
            <input type="checkbox" onclick="event.stopPropagation(); toggleDeckSelect('${d.id}')" ${state.selectedDeckIds.has(d.id)?'checked':''} style="width:18px; height:18px; accent-color:var(--gold-dark);">
            <div>
              <div class="word-main">${d.title}</div>
              <div class="meta">${d.words.length} מילים · ${d.detectedLanguage||''}</div>
            </div>
          </div>
          <div style="display:flex; align-items:center; gap:6px;">
            <button class="icon-btn" style="width:28px;height:28px;font-size:12px;" onclick="event.stopPropagation(); renameDeck('${d.id}')">✎</button>
            <button class="icon-btn" style="width:28px;height:28px;font-size:12px;" onclick="event.stopPropagation(); removeDeck('${d.id}')">✕</button>
          </div>
        </div>
      `).join('')}
      </div>
      ${state.savedDecks.length>1 ? `<button class="btn btn-ghost btn-sm" style="margin-top:8px;" onclick="selectAllDecks()">בחר הכל</button>` : ''}
    </div>`;
  } else {
    sec.innerHTML = '';
  }
}

window.toggleDeckSelect = function(id){
  if(state.selectedDeckIds.has(id)) state.selectedDeckIds.delete(id);
  else state.selectedDeckIds.add(id);
  renderSavedSection();
};
window.selectAllDecks = function(){
  if(state.selectedDeckIds.size === state.savedDecks.length){
    state.selectedDeckIds.clear();
  } else {
    state.savedDecks.forEach(d=>state.selectedDeckIds.add(d.id));
  }
  renderSavedSection();
};
window.playSelectedDecks = function(){
  const decks = state.savedDecks.filter(d=>state.selectedDeckIds.has(d.id));
  if(!decks.length) return;
  const mergedWords = [].concat(...decks.map(d=>d.words));
  state.deck = {
    id: 'merged-'+Date.now(),
    title: decks.length>1 ? `${decks.length} חפיסות יחד` : decks[0].title,
    detectedLanguage: decks[0].detectedLanguage,
    words: mergedWords,
    sourceText: '',
    langCode: decks[0].langCode
  };
  state.screen = 'games';
  render();
};

window.openDeck = function(id){
  const deck = state.savedDecks.find(d=>d.id===id);
  if(!deck) return;
  state.deck = deck;
  state.screen = 'games';
  render();
};
window.removeDeck = async function(id){
  await deleteDeck(id);
  state.savedDecks = state.savedDecks.filter(d=>d.id!==id);
  render();
};
window.renameDeck = async function(id){
  const deck = state.savedDecks.find(d=>d.id===id) || (state.deck && state.deck.id===id ? state.deck : null);
  if(!deck) return;
  const newName = prompt('שם חדש למסמך:', deck.title);
  if(!newName || !newName.trim()) return;
  deck.title = newName.trim();
  await saveDeck(deck);
  if(state.deck && state.deck.id===id) state.deck.title = deck.title;
  render();
};

function friendlyTitle(file, detectedLanguage){
  const raw = file.name.replace(/\.[^.]+$/,'').trim();
  // Camera/scan filenames are usually mostly digits or generic words like IMG/photo/scan/image
  const digitRatio = (raw.match(/\d/g)||[]).length / Math.max(raw.length,1);
  const looksGeneric = /^(img|image|photo|scan|screenshot|whatsapp|document|doc)[\s_-]*\d*$/i.test(raw);
  if(!raw || digitRatio > 0.4 || looksGeneric || raw.length > 40){
    const now = new Date();
    const dateStr = now.toLocaleDateString('he-IL', {day:'2-digit', month:'2-digit'});
    const timeStr = now.toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit'});
    const lang = detectedLanguage ? ' ' + detectedLanguage : '';
    return `מסמך${lang} · ${dateStr} ${timeStr}`;
  }
  return raw;
}

async function startProcessing(file){
  state.uploadedFile = file;
  state.screen = 'processing';
  state.processingStatus = 'מתחילים...';
  render();
  const onProgress = (msg)=>{
    state.processingStatus = msg;
    const el = document.getElementById('procStatus');
    if(el) el.textContent = msg;
  };
  try{
    const result = await processFile(file, onProgress);
    const deck = {
      id: 'd'+Date.now(),
      title: friendlyTitle(file, result.detectedLanguage),
      detectedLanguage: result.detectedLanguage || '',
      words: result.words,
      sourceText: result.sourceText || '',

      createdAt: Date.now()
    };
    state.deck = deck;
    await saveDeck(deck);
    state.screen = 'deckReview';
    render();
  }catch(err){
    state.errorMsg = err.message || 'משהו השתבש בעיבוד הקובץ';
    state.screen = 'error';
    render();
  }
}

async function startProcessingFromText(text){

// ---------------- FULL DOCUMENT TRANSLATION ----------------
function chunkText(text, maxLen){
  const sentences = text.split(/(?<=[.!?])\s+/);
  const chunks = [];
  let cur = '';
  sentences.forEach(s=>{
    if((cur+' '+s).trim().length > maxLen){
      if(cur.trim()) chunks.push(cur.trim());
      cur = s;
    } else {
      cur += (cur?' ':'') + s;
    }
  });
  if(cur.trim()) chunks.push(cur.trim());
  return chunks;
}

window.openFullTranslation = async function(){
  const d = state.deck;
  state.screen = 'fullTranslation';
  state.translatedText = '';
  state.translating = true;
  render();
  try{
    const chunks = chunkText(d.sourceText, 420);
    let result = '';
    for(let i=0;i<chunks.length;i++){
      const statusEl = document.getElementById('transStatus');
      if(statusEl) statusEl.textContent = `מתרגם קטע ${i+1} מתוך ${chunks.length}...`;
      try{
        const t = await mmTranslate(chunks[i], d.langCode||'en', 'he');
        result += (t || chunks[i]) + ' ';
      }catch(e){ result += chunks[i] + ' '; }
      await sleep(150);
    }
    state.translatedText = result.trim();
  }catch(e){
    state.translatedText = 'אירעה שגיאה בתרגום המסמך.';
  }
  state.translating = false;
  render();
};

}

// ---------------- QUIZ ----------------
function startQuiz(wordsOverride){
  const words = wordsOverride || getGameWords();
  const order = shuffle(words.map((_,i)=>i));
  state.gameData.quiz = { words, idx:0, order, score:0, answered:false, options:[], wrongWords:[] };
  buildQuizOptions();
  state.screen='quiz'; render();
}
window.retryMistakes = function(){
  const q = state.gameData.quiz;
  if(!q.wrongWords || !q.wrongWords.length) return;
  startQuiz(q.wrongWords);
};
function buildQuizOptions(){
  const q = state.gameData.quiz;
  const words = q.words;
  const correct = words[q.order[q.idx]];
  const direction = Math.random() < 0.5 ? 'toHebrew' : 'toForeign';
  q.direction = direction;
  const correctVal = direction==='toHebrew' ? correct.translation : correct.word;
  let pool = words.filter(w=>w!==correct).map(w=> direction==='toHebrew' ? w.translation : w.word);
  pool = shuffle(pool).slice(0,3);
  while(pool.length<3){ pool.push('—'); }
  const opts = shuffle([correctVal, ...pool]);
  q.options = opts;
  q.answered = false;
  q.selectedIndex = null;
  q.autoPlayed = false;
}
function renderQuiz(){
  const q = state.gameData.quiz;
  const w = q.words[q.order[q.idx]];
  if(q.idx >= q.order.length){
    app.innerHTML = topbar(true,"goGames()") + `<div class="screen-body">
      <div class="card result-box">
        <div class="result-emoji">✓</div>
        <h2>סיימת את החידון!</h2>
        <div class="result-score">${q.score} / ${q.order.length}</div>
        <div style="margin-top:20px; display:flex; flex-direction:column; gap:10px;">
          ${q.wrongWords.length ? `<button class="btn btn-blue" onclick="retryMistakes()">תקן טעויות (${q.wrongWords.length})</button>` : ''}
          <button class="btn btn-primary" onclick="startQuiz()">שחק שוב</button>
          <button class="btn btn-ghost" onclick="goGames()">חזרה למשחקים</button>
        </div>
      </div>
    </div>`;
    return;
  }
  const toHebrew = q.direction==='toHebrew';
  const promptWord = toHebrew ? w.word : w.translation;
  const promptLangCode = toHebrew ? ((state.deck&&state.deck.langCode)||'en') : 'he';
  const correct = toHebrew ? w.translation : w.word;
  const promptCls = toHebrew ? 'ltr' : '';
  const optCls = toHebrew ? '' : 'ltr';
  app.innerHTML = topbar(true, "goGames()") + `<div class="screen-body">
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
        <span class="progress-txt" style="margin:0;">שאלה ${q.idx+1}/${q.order.length}</span>
        <span class="score-pill">${q.score} ✓</span>
      </div>
      <p class="sub" style="margin:10px 0 0;">${toHebrew ? 'מה התרגום של המילה?' : 'איזו מילה מתורגמת כך?'}</p>
      <div class="quiz-word ${promptCls}" style="display:flex; align-items:center; justify-content:center; gap:10px;">
        <span>${promptWord}</span>${speakerBtn(promptWord, promptLangCode)}
      </div>
      <div id="opts">
        ${q.options.map((opt,i)=>{
          let cls=optCls;
          if(q.answered){
            if(opt===correct) cls+=' correct';
            else if(i===q.selectedIndex) cls+=' wrong';
          }
          return `<button class="opt-btn ${cls}" data-i="${i}" onclick="answerQuiz(${i})">${opt}</button>`;
        }).join('')}
      </div>
      ${q.answered ? `<button class="btn btn-primary" style="margin-top:6px;" onclick="nextQuizQuestion()">הבא ←</button>` : ''}
    </div>
  </div>`;
  if(!q.autoPlayed){
    q.autoPlayed = true;
    setTimeout(()=> speakWord(promptWord, promptLangCode), 300);
  }
}
window.answerQuiz = function(i){
  const q = state.gameData.quiz;
  if(q.answered) return;
  q.answered = true;
  q.selectedIndex = i;
  const currentWord = q.words[q.order[q.idx]];
  const correct = q.direction==='toHebrew' ? currentWord.translation : currentWord.word;
  if(q.options[i]===correct){ q.score++; }
  else { q.wrongWords.push(currentWord); }
  const answerLang = q.direction==='toHebrew' ? 'he' : ((state.deck&&state.deck.langCode)||'en');
  speakWord(q.options[i], answerLang);
  render();
};
window.nextQuizQuestion = function(){
  const q = state.gameData.quiz;
  q.idx++;
  if(q.idx < q.order.length) buildQuizOptions();
  render();
};

// ---------------- MEMORY ----------------
function startMemory(){
  const pool_words = getGameWords();
  const words = shuffle(pool_words).slice(0, Math.min(6, pool_words.length));
  let cards = [];
  words.forEach((w,i)=>{
    cards.push({id:i, type:'word', text:w.word, pairId:i, cls:'ltr'});
    cards.push({id:i+100, type:'trans', text:w.translation, pairId:i, cls:''});
  });
  cards = shuffle(cards);
  state.gameData.memory = { cards, open:[], matched:[], moves:0, locked:false };
  state.screen='memory'; render();
}
function renderMemory(){
  const m = state.gameData.memory;
  const allMatched = m.matched.length === m.cards.length;
  app.innerHTML = topbar(true, "goGames()") + `<div class="screen-body">
    <div class="card">
      <div style="display:flex; justify-content:space-between; margin-bottom:14px;">
        <span class="progress-txt" style="margin:0;">מהלכים: ${m.moves}</span>
        <span class="score-pill">${m.matched.length/2} / ${m.cards.length/2} זוגות</span>
      </div>
      ${allMatched ? `
        <div class="result-box" style="padding:10px 0 16px;">
          <div class="result-emoji">✓</div>
          <h2>מצוין! מצאת את כל הזוגות</h2>
        </div>
      ` : ''}
      <div class="mem-grid">
        ${m.cards.map((c,i)=>{
          const isOpen = m.open.includes(i) || m.matched.includes(i);
          const len = String(c.text||'').length;
          const fs = len > 16 ? '10px' : len > 10 ? '12px' : len > 6 ? '14px' : '17px';
          return `<div class="mem-card ${isOpen?'open':''} ${m.matched.includes(i)?'matched':''}" style="${isOpen?`font-size:${fs};`:''}">
            ${isOpen ? `<span class="${c.cls}">${c.text}</span>` : '?'}
          </div>`;
        }).join('')}
      </div>
      ${allMatched ? `
        <div style="display:flex; flex-direction:column; gap:10px; margin-top:16px;">
          <button class="btn btn-primary" onclick="startMemory()">שחק שוב</button>
          <button class="btn btn-ghost" onclick="goGames()">חזרה למשחקים</button>
        </div>
      ` : ''}
    </div>
  </div>`;
  if(!allMatched){
    document.querySelectorAll('.mem-card').forEach((el,i)=>{
      el.onclick = ()=> memFlip(i);
    });
  }
}
window.memFlip = function(i){
  const m = state.gameData.memory;
  if(m.locked || m.open.includes(i) || m.matched.includes(i) || m.open.length>=2) return;
  m.open.push(i);
  if(m.open.length===2){
    m.moves++;
    const [a,b] = m.open;
    if(m.cards[a].pairId === m.cards[b].pairId){
      m.matched.push(a,b);
      m.open = [];
      render();
      const wordCard = m.cards[a].type==='word' ? m.cards[a] : m.cards[b];
      setTimeout(()=> speakWord(wordCard.text, (state.deck&&state.deck.langCode)||'en'), 200);
    } else {
      m.locked = true;
      render();
      setTimeout(()=>{ m.open=[]; m.locked=false; render(); }, 850);
    }
    return;
  }
  render();
};

// ---------------- Utils ----------------
// ---------------- Pronunciation ----------------
const SPEAK_LANG_MAP = {pt:'pt-PT', en:'en-US', es:'es-ES', fr:'fr-FR', de:'de-DE', it:'it-IT', he:'he-IL'};
window.speakWord = function(text, langCode){
  try{
    if(!state.soundEnabled) return;
    if(!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = SPEAK_LANG_MAP[langCode] || 'en-US';
    utter.rate = 0.88;
    window.speechSynthesis.speak(utter);
  }catch(e){}
};
function speakerBtn(word, langCode){
  const safe = String(word).replace(/'/g, "\\'").replace(/"/g,'&quot;');
  const lc = langCode || ((state.deck&&state.deck.langCode)||'en');
  return `<button class="speak-btn" onclick="event.stopPropagation(); speakWord('${safe}', '${lc}')" aria-label="הקרא הגייה">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
    </svg>
  </button>`;
}

// ---------------- Shareable links ----------------
function encodeDeckToLink(deck){
  const slim = {
    t: deck.title,
    l: deck.detectedLanguage || '',
    lc: deck.langCode || 'en',
    w: deck.words.map(w=>[w.word, w.translation, w.pos||'', w.example||''])
  };
  const json = JSON.stringify(slim);
  const b64 = btoa(unescape(encodeURIComponent(json)));
  const base = location.href.split('?')[0].split('#')[0];
  return `${base}?deck=${encodeURIComponent(b64)}`;
}
function decodeDeckFromLink(b64){
  const json = decodeURIComponent(escape(atob(decodeURIComponent(b64))));
  const slim = JSON.parse(json);
  return {
    id: 'shared-'+Date.now(),
    title: slim.t || 'חפיסה משותפת',
    detectedLanguage: slim.l || '',
    langCode: slim.lc || 'en',
    sourceText: '',
    words: (slim.w||[]).map(arr=>({word:arr[0], translation:arr[1], pos:arr[2]||'', example:arr[3]||'', length:(arr[0]||'').length})),
    createdAt: Date.now()
  };
}
window.shareCurrentDeck = async function(){
  if(!state.deck) return;
  let link;
  try{ link = encodeDeckToLink(state.deck); }
  catch(e){ alert('החפיסה גדולה מדי לשיתוף בקישור. נסה חפיסה עם פחות מילים.'); return; }
  try{
    if(navigator.share){
      await navigator.share({title: state.deck.title, text: 'תרגל איתי מילים ב-LinguaScan', url: link});
      return;
    }
  }catch(e){ /* user cancelled or share failed, fall through to copy */ }
  try{
    await navigator.clipboard.writeText(link);
    const btn = document.getElementById('shareLinkBtn');
    if(btn){
      const orig = btn.innerHTML;
      btn.innerHTML = '✓';
      btn.style.width = 'auto';
      btn.style.padding = '0 10px';
      btn.title = 'הקישור הועתק';
      setTimeout(()=>{ btn.innerHTML = orig; btn.style.width=''; btn.style.padding=''; btn.title='שתף קישור'; }, 1800);
    }
  }catch(e){
    prompt('העתק את הקישור:', link);
  }
};

function checkSharedLinkOnLoad(){
  const params = new URLSearchParams(location.search);
  const encoded = params.get('deck');
  if(!encoded) return false;
  try{
    const deck = decodeDeckFromLink(encoded);
    if(deck.words && deck.words.length){
      state.deck = deck;
      state.screen = 'games';
      saveDeck(deck);
      return true;
    }
  }catch(e){ /* bad/corrupt link, fall through to normal home */ }
  return false;
}

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

checkSharedLinkOnLoad();
render();
