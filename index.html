<style>
:root{
  --blue:#7B9BC2; --blue-light:#EAF0F8; --blue-dark:#4F6E96;
  --pink:#D9A0B3; --pink-light:#FBF0F3; --pink-dark:#B87A8E;
  --brown:#AB8768; --brown-light:#F5EEE4; --brown-dark:#8A6B4E;
  --cream:#FAF7F3; --paper:#FFFFFF;
  --line:#EAE3DA;
  --text:#3D3630; --text-soft:#948A7E;
  --green:#7FA987; --red:#C77E7E; --amber:#D6A968;
  --radius:18px; --radius-sm:12px;
  --shadow:0 2px 16px rgba(80,64,48,0.06);
  --shadow-sm:0 1px 6px rgba(80,64,48,0.05);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; overflow:hidden; overscroll-behavior:none;}
body{
  margin:0;
  font-family:'Heebo',sans-serif; color:var(--text);
  background:var(--cream);
}
.serif{font-family:'Frank Ruhl Libre',serif;}
.ltr{direction:ltr; font-family:'Poppins',sans-serif; unicode-bidi:isolate;}
#app{max-width:520px; margin:0 auto; padding:0 18px; height:100dvh; display:flex; flex-direction:column; overflow:hidden;}
.topbar{display:flex; align-items:center; justify-content:space-between; padding:16px 0 14px; border-bottom:1px solid var(--line); flex-shrink:0;}
.screen-body{flex:1; min-height:0; overflow-y:auto; padding:16px 0 18px; -webkit-overflow-scrolling:touch;}
.list-scroll{max-height:32vh; overflow-y:auto; -webkit-overflow-scrolling:touch;}
.logo{display:flex; align-items:center; gap:11px;}
.logo-dot{width:36px; height:36px; border-radius:10px; background:var(--paper); border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:16px;}
.logo-text{font-family:'Frank Ruhl Libre',serif; font-weight:600; font-size:20px; letter-spacing:0.2px;}
.logo-sub{font-size:11px; color:var(--text-soft); margin-top:1px;}
.icon-btn{width:36px; height:36px; border-radius:10px; border:1.5px solid var(--line); background:var(--paper); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:15px; color:var(--text-soft);}

.card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:24px; margin-bottom:16px;}
h1{font-family:'Frank Ruhl Libre',serif; font-size:23px; font-weight:600; margin:0 0 6px; letter-spacing:0.1px;}
h2{font-family:'Frank Ruhl Libre',serif; font-size:18px; font-weight:600; margin:0 0 10px;}
p.sub{color:var(--text-soft); font-size:13.5px; line-height:1.7; margin:0 0 18px;}

.steps{display:flex; flex-direction:column; gap:12px; margin-bottom:20px;}
.step{display:flex; align-items:flex-start; gap:12px;}
.step-num{width:24px; height:24px; min-width:24px; border-radius:50%; border:1.5px solid var(--blue); color:var(--blue-dark); font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:1px;}
.step-txt{font-size:13.5px; line-height:1.6; color:var(--text);}
.step-txt b{font-weight:600;}

.dropzone{
  border:1.5px dashed #CDBFAE; border-radius:var(--radius);
  background:var(--brown-light); padding:34px 18px; text-align:center;
  cursor:pointer; transition:.2s; margin-bottom:12px;
}
.dropzone.drag{background:var(--blue-light); border-color:var(--blue);}
.dropzone .icn{font-size:28px; margin-bottom:10px; opacity:.75;}
.dropzone .txt{font-weight:600; font-size:14.5px;}
.dropzone .txt2{font-size:12px; color:var(--text-soft); margin-top:5px;}
.filetypes{display:flex; gap:8px; justify-content:center; margin-top:16px; flex-wrap:wrap;}
.filetype-chip{background:var(--paper); border:1px solid var(--line); border-radius:999px; padding:6px 13px; font-size:11.5px; color:var(--text-soft);}

.btn{
  border:none; border-radius:14px; padding:14px 18px; font-family:inherit;
  font-weight:600; font-size:14.5px; cursor:pointer; width:100%;
  display:flex; align-items:center; justify-content:center; gap:8px;
  transition:.15s;
}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--blue-dark); color:#fff;}
.btn-pink{background:var(--pink-dark); color:#fff;}
.btn-brown{background:var(--paper); color:var(--brown-dark); border:1.5px solid var(--brown);}
.btn-ghost{background:var(--paper); color:var(--text); border:1.5px solid var(--line);}
.btn-sm{padding:9px 14px; font-size:13px; width:auto;}
.btn[disabled]{opacity:.45; cursor:not-allowed;}

.game-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.game-tile{
  border-radius:16px; padding:18px 15px; cursor:pointer; border:1.5px solid var(--line);
  background:var(--paper); position:relative; overflow:hidden; min-height:112px;
  display:flex; flex-direction:column; justify-content:flex-end;
}
.game-tile .icon{position:absolute; top:14px; left:14px; font-size:20px; opacity:.55;}
.game-tile .title{font-family:'Frank Ruhl Libre',serif; font-weight:600; font-size:15.5px; color:var(--text);}
.game-tile .desc{font-size:11px; opacity:.8; margin-top:2px; color:var(--text-soft);}
.tile-1{border-top:3px solid var(--blue);}
.tile-2{border-top:3px solid var(--pink);}
.tile-3{border-top:3px solid var(--brown);}
.tile-4{border-top:3px solid var(--green);}

.deck-item{
  display:flex; align-items:center; justify-content:space-between;
  background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px;
  cursor:pointer;
}
.deck-item .meta{font-size:12px; color:var(--text-soft); margin-top:2px;}
.deck-badge{background:var(--blue-light); color:var(--blue-dark); font-size:11px; padding:4px 10px; border-radius:999px; font-weight:600;}

.spinner{width:38px; height:38px; border-radius:50%; border:3px solid var(--blue-light); border-top-color:var(--blue-dark); animation:spin 0.9s linear infinite; margin:20px auto;}
@keyframes spin{to{transform:rotate(360deg);}}
.center-txt{text-align:center; color:var(--text-soft); font-size:14px;}

.word-row{display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--line);}
.word-row:last-child{border-bottom:none;}
.word-main{font-weight:600; font-size:15px;}
.word-trans{color:var(--text-soft); font-size:13px; margin-top:1px;}
.chip-len{background:var(--brown-light); color:var(--brown-dark); font-size:11px; padding:3px 9px; border-radius:999px; font-weight:600;}

/* Flashcard */
.flip-wrap{perspective:1200px; margin-bottom:18px;}
.flip-card{position:relative; width:100%; height:230px; transition:transform .5s; transform-style:preserve-3d; cursor:pointer;}
.flip-card.flipped{transform:rotateY(180deg);}
.flip-face{
  position:absolute; inset:0; backface-visibility:hidden; border-radius:var(--radius);
  display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px;
  box-shadow:var(--shadow); text-align:center; border:1px solid var(--line);
}
.flip-front{background:var(--blue-light); color:var(--blue-dark);}
.flip-back{background:var(--pink-light); color:var(--pink-dark); transform:rotateY(180deg);}
.flip-word{font-family:'Frank Ruhl Libre',serif; font-size:29px; font-weight:600;}
.flip-pos{font-size:12px; opacity:.8; margin-top:6px;}
.flip-example{font-size:13px; opacity:.85; margin-top:14px; line-height:1.5;}
.nav-row{display:flex; gap:10px; margin-top:8px;}
.progress-txt{text-align:center; color:var(--text-soft); font-size:13px; margin-bottom:10px;}

/* Quiz */
.quiz-word{font-family:'Frank Ruhl Libre',serif; font-size:27px; font-weight:600; text-align:center; margin:12px 0 24px;}
.opt-btn{
  display:block; width:100%; text-align:right; background:var(--paper); border:1.5px solid var(--line);
  border-radius:12px; padding:14px 16px; margin-bottom:10px; font-family:inherit; font-size:14px;
  cursor:pointer; font-weight:600;
}
.opt-btn.correct{border-color:var(--green); background:#EEF5EF; color:#3C7A4C;}
.opt-btn.wrong{border-color:var(--red); background:#FBEFEF; color:#A04949;}
.score-pill{background:var(--blue-light); color:var(--blue-dark); border-radius:999px; padding:5px 14px; font-size:13px; font-weight:700;}

/* Wordle */
.wl-grid{display:grid; gap:5px; margin-bottom:16px; max-width:340px; margin-left:auto; margin-right:auto;}
.wl-row{display:grid; gap:5px;}
.wl-cell{
  aspect-ratio:1; border-radius:4px; border:2px solid var(--line); background:var(--paper);
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:20px;
  text-transform:uppercase; font-family:'Poppins',sans-serif; color:var(--text);
}
.wl-cell.g{background:var(--green); border-color:var(--green); color:#fff;}
.wl-cell.y{background:var(--amber); border-color:var(--amber); color:#fff;}
.wl-cell.b{background:#9E9285; border-color:#9E9285; color:#fff;}
.kb{display:flex; flex-direction:column; gap:6px; margin-top:14px; max-width:380px; margin-left:auto; margin-right:auto;}
.kb-row{display:flex; gap:5px; justify-content:center;}
.kb-key{
  flex:1; max-width:34px; height:44px; border-radius:6px; border:none; background:var(--brown-light);
  font-family:'Poppins',sans-serif; font-weight:600; font-size:12px;
  text-transform:uppercase; cursor:pointer; color:var(--text);
}
.kb-key.wide{max-width:52px; font-size:10.5px;}
.kb-key.g{background:var(--green); color:#fff;}
.kb-key.y{background:var(--amber); color:#fff;}
.kb-key.b{background:#9E9285; color:#fff;}

/* Memory */
.mem-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
.mem-card{
  aspect-ratio:0.85; border-radius:10px; background:var(--brown-light); border:1.5px solid var(--line);
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  font-size:20px; color:var(--brown-dark); text-align:center; padding:6px; font-weight:600;
}
.mem-card.open{background:var(--paper); color:var(--text); font-size:12px; border:1.5px solid var(--blue);}
.mem-card.matched{background:var(--green); border-color:var(--green); color:#fff; opacity:.5;}

.upload-preview{display:flex; align-items:center; gap:10px; background:var(--brown-light); border-radius:12px; padding:10px 14px; margin-bottom:14px;}
.upload-preview .fname{font-size:13px; font-weight:600; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
input[type=file]{display:none;}
.err-box{background:#FBEFEF; color:#A04949; border:1px solid #EFD5D5; border-radius:12px; padding:12px 14px; font-size:13px; margin-bottom:14px;}
.result-box{text-align:center; padding:30px 0;}
.result-emoji{font-size:40px; margin-bottom:10px; opacity:.85;}
.result-score{font-family:'Frank Ruhl Libre',serif; font-size:32px; font-weight:600;}
</style>

<body>
<div id="app"></div>

<script>
// ---------------- Global State ----------------
let state = {
  screen: 'home',
  deck: null,
  savedDecks: [],
  uploadedFile: null,
  gameData: {}
};

const app = document.getElementById('app');

// ---------------- Storage ----------------
const hasClaudeStorage = typeof window.storage !== 'undefined';

async function loadSavedDecks(){
  try{
    if(hasClaudeStorage){
      const list = await window.storage.list('deck:');
      if(!list || !list.keys) return [];
      const decks = [];
      for(const k of list.keys){
        try{
          const r = await window.storage.get(k);
          if(r) decks.push(JSON.parse(r.value));
        }catch(e){}
      }
      decks.sort((a,b)=> b.createdAt - a.createdAt);
      return decks;
    } else {
      const raw = localStorage.getItem('linguaScanDecks');
      const decks = raw ? JSON.parse(raw) : [];
      decks.sort((a,b)=> b.createdAt - a.createdAt);
      return decks;
    }
  }catch(e){ return []; }
}
async function saveDeck(deck){
  try{
    if(hasClaudeStorage){
      await window.storage.set('deck:'+deck.id, JSON.stringify(deck));
    } else {
      const raw = localStorage.getItem('linguaScanDecks');
      const decks = raw ? JSON.parse(raw) : [];
      decks.push(deck);
      localStorage.setItem('linguaScanDecks', JSON.stringify(decks));
    }
  }catch(e){}
}
async function deleteDeck(id){
  try{
    if(hasClaudeStorage){
      await window.storage.delete('deck:'+id);
    } else {
      const raw = localStorage.getItem('linguaScanDecks');
      let decks = raw ? JSON.parse(raw) : [];
      decks = decks.filter(d=>d.id!==id);
      localStorage.setItem('linguaScanDecks', JSON.stringify(decks));
    }
  }catch(e){}
}

// ---------------- Language options & stopwords ----------------
const LANG_OPTIONS = [
  {code:'por', mm:'pt', label:'פורטוגזית'},
  {code:'eng', mm:'en', label:'אנגלית'},
  {code:'spa', mm:'es', label:'ספרדית'},
  {code:'fra', mm:'fr', label:'צרפתית'},
  {code:'deu', mm:'de', label:'גרמנית'},
  {code:'ita', mm:'it', label:'איטלקית'}
];
state.selectedLang = 'por';

const STOPWORDS = {
  pt: ['a','o','os','as','um','uma','uns','umas','de','do','da','dos','das','em','no','na','nos','nas','para','por','com','sem','que','se','e','ou','mas','como','mais','muito','ja','sao','foi','ser','estar','tem','ter','seu','sua','seus','suas','este','esta','isso','isto','aquele','aquela','eu','tu','ele','ela','nos','voces','eles','elas','me','te','lhe','nao','sim','ao','aos','pelo','pela','pelos','pelas','entre','sobre','ate','desde','quando','onde','porque','tambem','so','ainda','depois','antes'],
  en: ['the','a','an','of','to','in','on','at','for','with','without','and','or','but','as','is','are','was','were','be','been','being','have','has','had','this','that','these','those','i','you','he','she','it','we','they','me','him','her','us','them','my','your','his','its','our','their','not','no','yes','so','if','then','than','because','also','still','after','before','from','by','about','into','over','under'],
  es: ['el','la','los','las','un','una','unos','unas','de','del','en','y','o','pero','que','se','es','son','fue','ser','estar','tiene','tener','su','sus','este','esta','eso','esto','yo','tu','el','ella','nosotros','ellos','ellas','me','te','le','no','si','al','por','para','con','sin','entre','sobre','hasta','desde','cuando','donde','porque','tambien','solo','aun','despues','antes'],
  fr: ['le','la','les','un','une','des','de','du','en','et','ou','mais','que','qui','se','est','sont','etre','avoir','ce','cette','ces','je','tu','il','elle','nous','vous','ils','elles','me','te','lui','ne','pas','oui','non','au','aux','par','pour','avec','sans','entre','sur','jusque','depuis','quand','ou','parce','aussi','encore','apres','avant'],
  de: ['der','die','das','ein','eine','einen','einem','einer','und','oder','aber','dass','sich','ist','sind','war','waren','sein','haben','hat','hatte','dieser','diese','dieses','ich','du','er','sie','es','wir','ihr','mich','dich','ihn','nicht','ja','nein','am','im','zum','zur','fur','mit','ohne','zwischen','uber','bis','seit','wann','wo','weil','auch','noch','nach','vor'],
  it: ['il','lo','la','i','gli','le','un','uno','una','di','del','della','in','e','o','ma','che','si','e','sono','stato','essere','avere','ha','questo','questa','io','tu','lui','lei','noi','voi','loro','mi','ti','lo','non','si','no','al','per','con','senza','tra','fra','sopra','fino','da','quando','dove','perche','anche','ancora','dopo','prima']
};

function escapeRegex(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '$&'); }
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

function extractVocabFromText(text, langOpt){
  const sentences = text.split(/(?<=[.!?])\s+/).filter(s=>s.trim().length>2);
  const tokens = (text.toLowerCase().match(/[\p{L}'-]+/gu)) || [];
  const stop = STOPWORDS[langOpt.mm] || [];
  const freq = {};
  tokens.forEach(w=>{
    if(w.length<3 || w.length>18) return;
    if(stop.includes(w)) return;
    if(/^\d+$/.test(w)) return;
    if(/(.)\1{3,}/.test(w)) return; // ocr noise like "aaaa"
    if(!/[aeiouàáâãäèéêëìíîïòóôõöùúûü]/i.test(w)) return; // no vowel at all = likely garbage
    freq[w] = (freq[w]||0)+1;
  });
  let candidates = Object.keys(freq).sort((a,b)=> freq[b]-freq[a]).slice(0,30);
  return candidates.map(w=>{
    const example = sentences.find(s=> s.toLowerCase().includes(w)) || '';
    const m = text.match(new RegExp('\\b'+escapeRegex(w)+'\\b','i'));
    const original = m ? m[0] : w;
    return { word: original, translation:'', pos:'', example: example.trim().slice(0,140), length: original.length };
  });
}

function hasHebrew(s){ return /[\u0590-\u05FF]/.test(s); }

async function mmTranslate(text, srcCode, tgtCode){
  const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${srcCode}|${tgtCode}`);
  const data = await res.json();
  const t = data && data.responseData && data.responseData.translatedText;
  return (t || '').trim();
}

async function translateWords(words, srcCode, tgtCode, onProgress){
  const out = [];
  for(let i=0;i<words.length;i++){
    const w = words[i];
    if(onProgress) onProgress(`מתרגם מילים... (${i+1}/${words.length})`);
    try{
      let t = await mmTranslate(w.word, srcCode, tgtCode);
      // MyMemory sometimes has no direct pair data and echoes back a non-Hebrew guess.
      // Fall back to a two-step translation through English, which has far richer coverage.
      if((!t || !hasHebrew(t) || t.toLowerCase()===w.word.toLowerCase()) && srcCode!=='en'){
        await sleep(150);
        const viaEn = await mmTranslate(w.word, srcCode, 'en');
        if(viaEn && viaEn.toLowerCase()!==w.word.toLowerCase()){
          await sleep(150);
          const heFromEn = await mmTranslate(viaEn, 'en', tgtCode);
          if(heFromEn && hasHebrew(heFromEn)) t = heFromEn;
        }
      }
      if(t && hasHebrew(t)){
        w.translation = t;
        out.push(w);
      }
    }catch(e){ /* skip word on failure */ }
    await sleep(150);
  }
  return out;
}

// ---------------- OCR / text extraction (free, local) ----------------
function preprocessImageForOcr(file){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      const maxDim = 2000;
      let {width,height} = img;
      if(width>maxDim || height>maxDim){
        if(width>height){ height=Math.round(height*maxDim/width); width=maxDim; }
        else{ width=Math.round(width*maxDim/height); height=maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width=width; canvas.height=height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,width,height);
      const imgData = ctx.getImageData(0,0,width,height);
      const d = imgData.data;
      for(let i=0;i<d.length;i+=4){
        const gray = 0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
        const contrast = Math.min(255, Math.max(0, (gray-128)*1.35+128));
        d[i]=d[i+1]=d[i+2]=contrast;
      }
      ctx.putImageData(imgData,0,0);
      URL.revokeObjectURL(url);
      resolve(canvas);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('לא ניתן לקרוא את התמונה')); };
    img.src = url;
  });
}

async function extractTextFromImage(file, langCode, onProgress){
  if(onProgress) onProgress('מכין את התמונה...');
  const canvas = await preprocessImageForOcr(file);
  if(onProgress) onProgress('מזהה טקסט בתמונה...');
  const { data } = await Tesseract.recognize(canvas, langCode, {
    logger: m=>{ if(onProgress && m.status==='recognizing text') onProgress('מזהה טקסט... ' + Math.round((m.progress||0)*100) + '%'); }
  });
  return data.text || '';
}

async function extractTextFromPdf(file, langCode, onProgress){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  let fullText = '';
  const textPages = Math.min(pdf.numPages, 8);
  for(let i=1;i<=textPages;i++){
    if(onProgress) onProgress(`קורא עמוד ${i} מתוך ${textPages}...`);
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    fullText += content.items.map(it=>it.str).join(' ') + '\n';
  }
  if(fullText.trim().length < 40){
    fullText = '';
    const ocrPages = Math.min(pdf.numPages, 3);
    for(let i=1;i<=ocrPages;i++){
      if(onProgress) onProgress(`מזהה טקסט בעמוד ${i} (סריקה)...`);
      const page = await pdf.getPage(i);
      const viewport = page.getViewport({scale:2});
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width; canvas.height = viewport.height;
      const ctx = canvas.getContext('2d');
      await page.render({canvasContext: ctx, viewport}).promise;
      const { data } = await Tesseract.recognize(canvas, langCode);
      fullText += (data.text||'') + '\n';
    }
  }
  return fullText;
}

async function processFile(file, onProgress){
  const langOpt = LANG_OPTIONS.find(l=>l.code===state.selectedLang) || LANG_OPTIONS[0];
  const ext = file.name.split('.').pop().toLowerCase();
  if(file.size > 25*1024*1024){
    throw new Error('הקובץ גדול מדי (מעל 25MB). נסה קובץ קטן יותר.');
  }
  let rawText = '';
  if(['png','jpg','jpeg','webp','gif'].includes(ext)){
    rawText = await extractTextFromImage(file, langOpt.code, onProgress);
  } else if(ext==='pdf'){
    rawText = await extractTextFromPdf(file, langOpt.code, onProgress);
  } else if(ext==='docx'){
    if(onProgress) onProgress('קורא את קובץ ה-Word...');
    const buf = await file.arrayBuffer();
    const result = await mammoth.extractRawText({arrayBuffer: buf});
    rawText = result.value;
  } else if(['xlsx','xls','csv'].includes(ext)){
    if(onProgress) onProgress('קורא את קובץ האקסל...');
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    rawText = wb.SheetNames.map(n=>XLSX.utils.sheet_to_csv(wb.Sheets[n])).join('\n');
  } else {
    throw new Error('סוג קובץ לא נתמך');
  }
  if(!rawText || rawText.trim().length < 20){
    throw new Error('לא הצלחנו לזהות מספיק טקסט בקובץ. נסה תמונה ברורה וחדה יותר, או ודא שבחרת את השפה הנכונה.');
  }
  if(onProgress) onProgress('בוחר את המילים החשובות...');
  let words = extractVocabFromText(rawText, langOpt);
  if(words.length < 4){
    throw new Error('נמצאו מעט מדי מילים מתאימות בטקסט. נסה קובץ עם יותר תוכן.');
  }
  words = await translateWords(words, langOpt.mm, 'he', onProgress);
  if(words.length < 4){
    throw new Error('לא הצלחנו לתרגם מספיק מילים כרגע. נסה שוב בעוד רגע.');
  }
  return { detectedLanguage: langOpt.label, words };
}

// ---------------- WORDLE ----------------
function startWordle(){
  const allLengths = [...new Set(state.deck.words.map(w=>w.length))];
  const preferred = allLengths.filter(l=>l>=4 && l<=7);
  const pool = preferred.length ? preferred : allLengths.filter(l=>l>=3 && l<=9);
  if(!pool.length){
    state.errorMsg = 'אין מילים באורך מתאים למשחק וורדל';
    state.screen='error'; render(); return;
  }
  const chosenLen = pool[Math.floor(Math.random()*pool.length)];
  const candidates = state.deck.words.filter(w=>w.length===chosenLen);
  const target = candidates[Math.floor(Math.random()*candidates.length)];
  state.gameData.wordle = {
    target: target.word.toLowerCase(),
    translation: target.translation,
    len: chosenLen,
    guesses: [],
    current: '',
    maxGuesses: 6,
    status: 'playing',
    keyStates: {}
  };
  state.screen='wordle'; render();
}
function evalGuess(guess, target){
  const res = new Array(target.length).fill('b');
  const tArr = target.split(''); const gArr = guess.split('');
  const used = new Array(target.length).fill(false);
  for(let i=0;i<gArr.length;i++){
    if(gArr[i]===tArr[i]){ res[i]='g'; used[i]=true; }
  }
  for(let i=0;i<gArr.length;i++){
    if(res[i]==='g') continue;
    const idx = tArr.findIndex((c,j)=>c===gArr[i] && !used[j]);
    if(idx>-1){ res[i]='y'; used[idx]=true; }
  }
  return res;
}
function renderWordle(){
  const wl = state.gameData.wordle;
  const rows = [];
  for(let r=0;r<wl.maxGuesses;r++){
    const guess = wl.guesses[r];
    const isCurrent = r===wl.guesses.length && wl.status==='playing';
    let cells = '';
    for(let c=0;c<wl.len;c++){
      let cls='', letter='';
      if(guess){ letter = guess.word[c]; cls = guess.result[c]; }
      else if(isCurrent && wl.current[c]){ letter = wl.current[c]; }
      cells += `<div class="wl-cell ${cls}">${letter||''}</div>`;
    }
    rows.push(`<div class="wl-row" dir="ltr" style="grid-template-columns:repeat(${wl.len},1fr);">${cells}</div>`);
  }
  const keyRows = [['q','w','e','r','t','y','u','i','o','p'],['a','s','d','f','g','h','j','k','l'],['ENTER','z','x','c','v','b','n','m','⌫']];
  app.innerHTML = topbar(true, "goGames()") + `<div class="screen-body">
    <div class="card">
      <p class="sub" style="margin-bottom:14px;">נחש מילה בת ${wl.len} אותיות. רמז: התרגום הוא "${wl.translation}"</p>
      <div class="wl-grid" dir="ltr">${rows.join('')}</div>
      ${wl.status!=='playing' ? `
        <div class="result-box" style="padding:10px 0 20px;">
          <div class="result-emoji serif">${wl.status==='won'?'✓':'—'}</div>
          <h2>${wl.status==='won' ? 'כל הכבוד!' : 'המילה הייתה: '+wl.target}</h2>
          <button class="btn btn-primary" style="margin-top:12px;" onclick="startWordle()">מילה חדשה</button>
        </div>
      ` : `
        <div class="kb" dir="ltr">
          ${keyRows.map(row=>`<div class="kb-row">
            ${row.map(k=>`<button class="kb-key ${k.length===1?(wl.keyStates[k]||''):''} ${k.length>1?'wide':''}" onclick="wlKey('${k}')">${k==='ENTER'?'Enter':k}</button>`).join('')}
          </div>`).join('')}
        </div>
      `}
    </div>
  </div>`;
}
window.wlKey = function(k){
  const wl = state.gameData.wordle;
  if(wl.status!=='playing') return;
  if(k==='ENTER'){
    if(wl.current.length!==wl.len) return;
    const result = evalGuess(wl.current, wl.target);
    result.forEach((r,i)=>{
      const ch = wl.current[i];
      const rank = {b:0,y:1,g:2};
      if(!wl.keyStates[ch] || rank[r]>rank[wl.keyStates[ch]]) wl.keyStates[ch]=r;
    });
    wl.guesses.push({word:wl.current, result});
    if(wl.current===wl.target){ wl.status='won'; }
    else if(wl.guesses.length>=wl.maxGuesses){ wl.status='lost'; }
    wl.current='';
  } else if(k==='⌫'){
    wl.current = wl.current.slice(0,-1);
  } else {
    if(wl.current.length < wl.len) wl.current += k;
  }
  render();
};
document.addEventListener('keydown', (e)=>{
  if(state.screen!=='wordle') return;
  const wl = state.gameData.wordle;
  if(!wl || wl.status!=='playing') return;
  if(e.key==='Enter') wlKey('ENTER');
  else if(e.key==='Backspace') wlKey('⌫');
  else if(/^[a-zA-Z]$/.test(e.key)) wlKey(e.key.toLowerCase());
});

// ---------------- MEMORY ----------------
function startMemory(){
  const words = shuffle(state.deck.words).slice(0, Math.min(6, state.deck.words.length));
  let cards = [];
  words.forEach((w,i)=>{
    cards.push({id:i, type:'word', text:w.word, pairId:i, cls:'ltr'});
    cards.push({id:i+100, type:'trans', text:w.translation, pairId:i, cls:''});
  });
  cards = shuffle(cards);
  state.gameData.memory = { cards, open:[], matched:[], moves:0, locked:false };
  state.screen='memory'; render();
}
function renderMemory(){
  const m = state.gameData.memory;
  const allMatched = m.matched.length === m.cards.length;
  app.innerHTML = topbar(true, "goGames()") + `<div class="screen-body">
    <div class="card">
      <div style="display:flex; justify-content:space-between; margin-bottom:14px;">
        <span class="progress-txt" style="margin:0;">מהלכים: ${m.moves}</span>
        <span class="score-pill">${m.matched.length/2} / ${m.cards.length/2} זוגות</span>
      </div>
      ${allMatched ? `
        <div class="result-box">
          <div class="result-emoji serif">✓</div>
          <h2>מצוין! מצאת את כל הזוגות</h2>
          <button class="btn btn-primary" style="margin-top:12px;" onclick="startMemory()">שחק שוב</button>
        </div>
      ` : `
        <div class="mem-grid">
          ${m.cards.map((c,i)=>{
            const isOpen = m.open.includes(i) || m.matched.includes(i);
            return `<div class="mem-card ${isOpen?'open':''} ${m.matched.includes(i)?'matched':''}" onclick="memFlip(${i})">
              ${isOpen ? `<span class="${c.cls}">${c.text}</span>` : '?'}
            </div>`;
          }).join('')}
        </div>
      `}
    </div>
  </div>`;
}
window.memFlip = function(i){
  const m = state.gameData.memory;
  if(m.locked || m.open.includes(i) || m.matched.includes(i) || m.open.length>=2) return;
  m.open.push(i);
  if(m.open.length===2){
    m.moves++;
    const [a,b] = m.open;
    if(m.cards[a].pairId === m.cards[b].pairId){
      m.matched.push(a,b);
      m.open = [];
      render();
    } else {
      m.locked = true;
      render();
      setTimeout(()=>{ m.open=[]; m.locked=false; render(); }, 850);
    }
    return;
  }
  render();
};

// ---------------- Utils ----------------
function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

render();
</script>
